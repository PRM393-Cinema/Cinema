# Chạy toàn bộ backend bằng một lệnh:  docker compose up -d --build
# Kèm giám sát (Prometheus + Grafana + Jaeger):  docker compose --profile monitoring up -d --build
# Hướng dẫn chi tiết: docs/DOCKER.md, docs/MONITORING.md   |   Key/mật khẩu đặt trong file .env (copy từ .env.example)
name: cinema

x-dotnet-service: &dotnet-service
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy

# Gmail gửi OTP (AuthService) và email đặt vé (BookingService), xem docs/EMAIL_SETUP.md
x-smtp-env: &smtp-env
  Smtp__Host: ${SMTP_HOST:-}
  Smtp__Username: ${SMTP_USERNAME:-}
  Smtp__Password: ${SMTP_PASSWORD:-}
  Smtp__FromEmail: ${SMTP_FROM_EMAIL:-}

# RabbitMQ: event booking / payment / suất chiếu (docs/MESSAGING.md)
x-rabbitmq-env: &rabbitmq-env
  RabbitMq__HostName: rabbitmq
  RabbitMq__UserName: ${RABBITMQ_USER:-cinema}
  RabbitMq__Password: ${RABBITMQ_PASSWORD:-cinema}

# Gửi trace sang Jaeger (profile monitoring). Jaeger không chạy thì trace bị bỏ, service vẫn chạy bình thường.
# Đặt OTEL_TRACES_ENDPOINT= (để trống) trong .env để tắt hẳn việc gửi trace
x-otel-env: &otel-env
  Observability__OtlpTracesEndpoint: ${OTEL_TRACES_ENDPOINT-http://jaeger:4318/v1/traces}

# Service cần cả PostgreSQL và RabbitMQ
x-depends-db-rabbitmq: &depends-db-rabbitmq
  postgres:
    condition: service_healthy
  rabbitmq:
    condition: service_healthy

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (copy from .env.example)}
      TZ: Asia/Ho_Chi_Minh
      PGTZ: Asia/Ho_Chi_Minh
    ports:
      # 5433 để không trùng PostgreSQL cài sẵn trên máy (5432). Chỉ mở cho máy này (127.0.0.1), máy khác trong mạng không kết nối được
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # File SQL của repo Project-Cinema-DB, mặc định nằm cạnh thư mục Cinema (đổi bằng DB_SCRIPTS_DIR trong .env)
      - ${DB_SCRIPTS_DIR:-../../Project-Cinema-DB}:/db-scripts:ro
      - ./docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      # Chỉ "healthy" khi server thật đã chạy và DB cuối cùng đã được tạo xong
      test: ["CMD-SHELL", "PGPASSWORD=\"$$POSTGRES_PASSWORD\" psql -h localhost -U postgres -d cinema_notification_db -c 'SELECT 1' > /dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management-alpine
    # Tên máy cố định: RabbitMQ lưu dữ liệu theo tên node, đổi tên thì mất queue đã tạo
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-cinema}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-cinema}
    ports:
      # 5672: service chạy bằng Visual Studio kết nối vào. 15672: trang quản lý http://localhost:15672
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  auth-service:
    <<: *dotnet-service
    build:
      context: .
      dockerfile: AuthService/AuthService/Dockerfile
    environment:
      <<: [*smtp-env, *otel-env]
      ASPNETCORE_ENVIRONMENT: Development
      TZ: Asia/Ho_Chi_Minh
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=cinema_auth_db;Username=postgres;Password=${POSTGRES_PASSWORD}
      Jwt__SecretKey: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env (at least 32 characters)}
    ports:
      # Service chỉ mở cho máy này (Swagger, debug); client bên ngoài phải đi qua api-gateway
      - "127.0.0.1:5100:8080"

  movie-service:
    <<: *dotnet-service
    depends_on: *depends-db-rabbitmq
    build:
      context: .
      dockerfile: MovieService/MovieService/Dockerfile
    environment:
      <<: [*rabbitmq-env, *otel-env]
      ASPNETCORE_ENVIRONMENT: Development
      TZ: Asia/Ho_Chi_Minh
      ConnectionStrings__MovieDb: Host=postgres;Port=5432;Database=cinema_movie_db;Username=postgres;Password=${POSTGRES_PASSWORD}
      ConnectionStrings__ShowtimeDb: Host=postgres;Port=5432;Database=cinema_showtime_db;Username=postgres;Password=${POSTGRES_PASSWORD}
      Jwt__SecretKey: ${JWT_SECRET_KEY}
    ports:
      - "127.0.0.1:5168:8080"

  booking-service:
    <<: *dotnet-service
    depends_on: *depends-db-rabbitmq
    build:
      context: .
      dockerfile: BookingService/BookingService/Dockerfile
    environment:
      <<: [*smtp-env, *rabbitmq-env, *otel-env]
      ASPNETCORE_ENVIRONMENT: Development
      TZ: Asia/Ho_Chi_Minh
      ConnectionStrings__BookingDb: Host=postgres;Port=5432;Database=cinema_booking_db;Username=postgres;Password=${POSTGRES_PASSWORD}
      ConnectionStrings__NotificationDb: Host=postgres;Port=5432;Database=cinema_notification_db;Username=postgres;Password=${POSTGRES_PASSWORD}
      ConnectionStrings__PaymentDb: Host=postgres;Port=5432;Database=cinema_payment_db;Username=postgres;Password=${POSTGRES_PASSWORD}
      Jwt__SecretKey: ${JWT_SECRET_KEY}
      ShowtimeService__BaseUrl: http://movie-service:8080/
      PayOS__ClientId: ${PAYOS_CLIENT_ID:-}
      PayOS__ApiKey: ${PAYOS_API_KEY:-}
      PayOS__ChecksumKey: ${PAYOS_CHECKSUM_KEY:-}
    ports:
      - "127.0.0.1:5063:8080"

  api-gateway:
    build:
      context: .
      dockerfile: ApiGateway/ApiGateway/Dockerfile
    environment:
      <<: *otel-env
      ASPNETCORE_ENVIRONMENT: Development
      TZ: Asia/Ho_Chi_Minh
      # Cổng 9464 chỉ dùng trong mạng Docker cho Prometheus đọc /metrics (không mở ra LAN như cổng 8080)
      ASPNETCORE_HTTP_PORTS: "8080;9464"
      Observability__MetricsPort: "9464"
      Jwt__SecretKey: ${JWT_SECRET_KEY}
      ReverseProxy__Clusters__auth-cluster__Destinations__auth-service__Address: http://auth-service:8080/
      ReverseProxy__Clusters__movie-cluster__Destinations__movie-service__Address: http://movie-service:8080/
      ReverseProxy__Clusters__booking-cluster__Destinations__booking-service__Address: http://booking-service:8080/
    ports:
      # Gateway mở cho cả mạng LAN để điện thoại thật gọi được: http://<IP máy>:5000
      - "5000:8080"
    depends_on:
      - auth-service
      - movie-service
      - booking-service
    restart: unless-stopped

  # ===== Giám sát (docs/MONITORING.md): chỉ chạy khi thêm --profile monitoring =====
  prometheus:
    image: prom/prometheus:v3.12.0
    profiles: [monitoring]
    volumes:
      - ./docker/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheusdata:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.0.2
    profiles: [monitoring]
    environment:
      # Chỉ mở cho máy này (127.0.0.1) nên vào thẳng, không cần đăng nhập
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/cinema-overview.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./docker/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
      - jaeger
    restart: unless-stopped

  jaeger:
    # Giữ 2.20.0: từ 2.21 Jaeger bỏ API /api/services... mà Grafana dùng để đọc trace
    image: jaegertracing/jaeger:2.20.0
    profiles: [monitoring]
    ports:
      # 16686: giao diện xem trace. 4318: nhận trace (OTLP HTTP), service chạy bằng Visual Studio gửi vào đây
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4318:4318"
    restart: unless-stopped

volumes:
  pgdata:
  rabbitmqdata:
  prometheusdata:
