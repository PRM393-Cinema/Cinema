<!doctype html>
<html>
  <head>
    <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
    <base href="$FLUTTER_BASE_HREF" />

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
    <meta
      name="description"
      content="Discover movies, choose your seats, and book your next cinema experience with CosmoQ Cinema."
    />

    <!-- iOS meta tags & icons -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="CosmoQ Cinema" />
    <link rel="apple-touch-icon" href="icons/Icon-192.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png?v=cosmoq" />
    <link rel="icon" type="image/svg+xml" href="cosmoq.svg" />

    <meta name="theme-color" content="#0B0D12" />
    <title>CosmoQ Cinema</title>
    <link rel="manifest" href="manifest.json" />
    <style>
      /* Flutter draws tap feedback; the browser otherwise highlights its whole view. */
      flutter-view,
      flutter-view * {
        -webkit-tap-highlight-color: transparent;
      }
      ::view-transition-group(root) {
        animation-duration: 240ms;
        animation-timing-function: ease-in-out;
      }
      ::view-transition {
        pointer-events: none;
      }
      @media (prefers-reduced-motion: reduce) {
        ::view-transition-group(root),
        ::view-transition-old(root),
        ::view-transition-new(root) {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
    <script>
      // Canonicalize old path URLs before Flutter starts its hash router.
      const appBasePath = new URL(document.baseURI).pathname;
      if (location.pathname !== appBasePath) {
        const routePath = location.pathname.startsWith(appBasePath)
          ? '/' + location.pathname.slice(appBasePath.length)
          : location.pathname;
        const routeHash = location.hash || '#' + routePath;
        history.replaceState(history.state, '', appBasePath + location.search + routeHash);
      }
    </script>
    <script src="browser_zoom.js"></script>
    <script src="flutter_bootstrap.js" async></script>
  </body>
</html>
